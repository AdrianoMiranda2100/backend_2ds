<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revolvers</title>
    <style>
        :root {
            --bg: #0b0c10;
            --card: #1f2833;
            --gold: #c5a880;
            --gold-hover: #e5c494;
            --white: #ffffff;
            --text-muted: #9ea9b3;
            --transition-fast: 0.2s ease-in-out;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--white);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Otimização de performance: gradient simples via CSS */
            background-image: radial-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 20px 20px;
            padding: 1rem;
        }

        .container {
            background: var(--card);
            padding: 2.5rem 2rem;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 100%;
            max-width: 380px;
            border: 1px solid rgba(197, 168, 128, 0.15);
            /* Garante renderização nítida em telas de alta densidade */
            transform: translateZ(0);
        }

        .hero-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 1.5rem;
            display: block;
            filter: drop-shadow(0 4px 8px rgba(197, 168, 128, 0.2));
        }

        h1 {
            font-size: 1.8rem;
            color: var(--gold);
            margin-bottom: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            background: var(--gold);
            color: var(--bg);
            text-decoration: none;
            font-weight: 700;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.85rem;
            transition: transform var(--transition-fast), background-color var(--transition-fast), box-shadow var(--transition-fast);
        }

        .btn:hover {
            background: var(--gold-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(197, 168, 128, 0.2);
        }

        .btn:focus-visible {
            outline: 3px solid var(--white);
            outline-offset: 2px;
        }

        .btn:active {
            transform: translateY(0);
        }

        svg { 
            fill: none; 
            stroke: currentColor;
        }
    </style>
</head>
<body>

    <main class="container">
        <!-- Substituído Base64 por código limpo inline para economizar KB e acelerar a renderização -->
        <svg class="hero-icon" viewBox="0 0 24 24" stroke="#c5a880" stroke-width="1.5" aria-hidden="true">
            <circle cx="12" cy="12" r="9"/>
            <circle cx="12" cy="12" r="3"/>
            <path stroke-linecap="round" d="M12 2v3m0 14v3M2 12h3m14 0h3"/>
        </svg>
        
        <h1>
            <svg width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 11h9a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2H4.42a1 1 0 0 0-.96.73L2.1 8.1A2 2 0 0 0 4 10.5H11M5 10.5v8a2 2 0 0 0 2 2h4v-10M15 11v3a1 1 0 0 1-1 1h-3"/></svg>
            Revolvers
        </h1>
        
        <p>Explore a engenharia de precisão e a história dos mecanismos clássicos.</p>
        
        <a href="/sobre" class="btn">
            <span>Ir para sobre</span>
            <svg width="16" height="16" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
        </a>
    </main>

</body>
</html>
