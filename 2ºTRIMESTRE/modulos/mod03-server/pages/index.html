<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revolvers</title>
    <style>
        :root {
            --bg: #0b0c10;
            --card: #1f2833;
            --gold: #c5a880;
            --white: #ffffff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--white);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(rgba(255,255,255,0.02) 1px, transparent 0);
            background-size: 20px 20px;
        }
        .container {
            background: var(--card);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 380px;
            width: 90%;
            border: 1px solid rgba(197, 168, 128, 0.1);
        }
        .hero-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 1.5rem;
            display: block;
            filter: drop-shadow(0 0 8px rgba(197, 168, 128, 0.3));
        }
        h3 {
            font-size: 1.8rem;
            color: var(--gold);
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        p {
            color: #9ea9b3;
            font-size: 0.95rem;
            margin-bottom: 2rem;
            line-height: 1.5;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            background: var(--gold);
            color: var(--bg);
            text-decoration: none;
            font-weight: 700;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.85rem;
            transition: transform 0.2s, background 0.2s;
        }
        .btn:hover {
            background: #e5c494;
            transform: translateY(-2px);
        }
        svg { fill: currentColor; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Imagem Base64 (SVG de Mira Otimizado) -->

            <!-- Ícone de Arma em SVG embutido puro (Sem carregar links externos) -->

            Revolvers

        <p>Explore a engenharia de precisão e a história dos mecanismos clássicos.</p>

</html>
